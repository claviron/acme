[package]
name = "claviron-acme"
version = "0.2.1"
publish = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/claviron/acme"
homepage = "https://github.com/claviron/acme"
description = "ACME certificate issuance and renewal for Claviron"
documentation = "https://docs.rs/claviron-acme"
keywords = ["acme", "tls", "certificates", "claviron"]
categories = ["network-programming", "web-programming::http-server"]
edition = "2024"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]

[features]
default = []
http-0 = ["server", "claviron/edge", "dep:bytes"]
resolver = ["claviron/resolver-hickory"]
db = ["dep:sqlx", "claviron/hosting"]
postgres = ["db", "claviron/postgres"]
# ACME accounts and logs in the SQLite file `db.yaml`'s `hosting:` names.
sqlite = ["db", "claviron/sqlite", "sqlx/sqlite"]
tasks = ["db", "claviron/server", "claviron/tasks", "dep:futures"]
server = [
    "claviron/server",
    "claviron/http",
    "dep:tokio-util",
    "dep:arc-swap",
]

[dependencies]

claviron = { version = "0.2.1", default-features = false, features = ["ssl"] }

sqlx = { version = "0.9", optional = true, features = ["runtime-tokio", "postgres", "uuid", "time"] }
tokio-util = { version = "0.7", optional = true, features = ["rt"] }
arc-swap = { version = "1.9", optional = true }
async-trait = "0.1"
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["fs", "rt", "sync", "time"] }
base64ct = { version = "1.8", features = ["alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "gzip", "brotli", "deflate", "multipart", "form", "rustls"] }
pkcs8 = { version = "0.11", features = ["pem"] }
p256 = { version = "0.14", features = ["pkcs8", "pem"] }
aws-lc-rs = { version = "1.17", features = ["ring-io"] }
pem = "4.0.0"
sha2 = "0.11"
thiserror = "2.0"
serde_json = "1.0"
tracing = "0.1"
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
serde = { version = "1", features = ["derive", "rc"] }

http = "1.5"
bytes = { version = "1.11", optional = true }
getrandom = "0.4"
url = { version = "2.5", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
serde_yaml = "0.9"
http-body = "1"
http-body-util = "0.1"
tempfile = "3.27"
